<app-toast />
<div class="main-layout">
  <app-sidebar [class.sidebar-open]="isSidebarOpen()" (closeSidebar)="closeSidebar()" />

  @if (isSidebarOpen()) {
    <button
      type="button"
      class="sidebar-backdrop"
      aria-label="Close sidebar"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="main-layout__content">
    <app-header (menuClick)="toggleSidebar()" />

    <main class="main-layout__page">
      <router-outlet />
    </main>
  </div>
</div>
