<div class="modal-backdrop" (click)="close()">
  <section class="debt-modal" (click)="$event.stopPropagation()">
    <header class="debt-modal__header">
      <div>
        <h2>
          {{ (isEditMode ? 'debts.form.editTitle' : 'debts.form.title') | translate }}
        </h2>

        <p>
          {{ 'debts.form.subtitle' | translate }}
        </p>
      </div>

      <button type="button" class="debt-modal__close" title="Close" (click)="close()">
        <lucide-icon [img]="X" [size]="18" />
      </button>
    </header>

    <form class="debt-form" (ngSubmit)="save()">
      <div class="form-field">
        <label for="debt-person">
          {{ 'debts.form.person' | translate }}
        </label>

        <input
          id="debt-person"
          type="text"
          name="personName"
          [(ngModel)]="form.personName"
          [placeholder]="'debts.form.personPlaceholder' | translate"
          required
        />
      </div>

      <div class="form-field">
        <label>
          {{ 'debts.form.type' | translate }}
        </label>

        <div class="debt-type-options">
          <button
            type="button"
            [class.active]="form.type === 'i-owe'"
            (click)="form.type = 'i-owe'"
          >
            {{ 'debts.types.iOwe' | translate }}
          </button>

          <button
            type="button"
            [class.active]="form.type === 'owed-to-me'"
            (click)="form.type = 'owed-to-me'"
          >
            {{ 'debts.types.owedToMe' | translate }}
          </button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="debt-total">
            {{ 'debts.form.totalAmount' | translate }}
          </label>

          <input
            id="debt-total"
            type="number"
            name="totalAmount"
            [(ngModel)]="form.totalAmount"
            min="1"
            required
          />
        </div>

        <div class="form-field">
          <label for="debt-paid">
            {{ 'debts.form.paidAmount' | translate }}
          </label>

          <input
            id="debt-paid"
            type="number"
            name="paidAmount"
            [(ngModel)]="form.paidAmount"
            min="0"
          />
        </div>
      </div>

      <div class="form-field">
        <label for="debt-date">
          {{ 'debts.form.dueDate' | translate }}
        </label>

        <input id="debt-date" type="date" name="dueDate" [(ngModel)]="form.dueDate" required />
      </div>

      <div class="form-field">
        <label for="debt-note">
          {{ 'debts.form.note' | translate }}
        </label>

        <textarea
          id="debt-note"
          name="note"
          [(ngModel)]="form.note"
          rows="3"
          [placeholder]="'debts.form.notePlaceholder' | translate"
        ></textarea>
      </div>

      <footer class="debt-modal__actions">
        <button type="button" class="cancel-btn" (click)="close()">
          {{ 'common.cancel' | translate }}
        </button>

        <button type="submit" class="save-btn" [disabled]="!isFormValid">
          {{ (isEditMode ? 'common.saveChanges' : 'common.save') | translate }}
        </button>
      </footer>
    </form>
  </section>
</div>
