@if (totalItems > 0) {
  <div class="pagination">

    <!-- Info -->

    <div class="pagination__info">
      <span>
        {{ 'common.pagination.showing' | translate }}
      </span>

      <strong>
        {{ startItem | localeNumber }}
      </strong>

      <span> - </span>

      <strong>
        {{ endItem | localeNumber }}
      </strong>

      <span>
        {{ 'common.pagination.of' | translate }}
      </span>

      <strong>
        {{ totalItems | localeNumber }}
      </strong>
    </div>


    <!-- Controls -->

    <nav
      class="pagination__controls"
      [attr.aria-label]="'common.pagination.navigation' | translate"
    >

      <button
        type="button"
        class="pagination__button pagination__arrow"
        [disabled]="currentPage === 1"
        (click)="previousPage()"
        [attr.aria-label]="'common.pagination.previous' | translate"
        [title]="'common.pagination.previous' | translate"
      >
        ‹
      </button>

      @for (
        page of pages;
        track page
      ) {
        <button
          type="button"
          class="pagination__button"
          [class.active]="currentPage === page"
          [attr.aria-current]="currentPage === page ? 'page' : null"
          [attr.aria-label]="
            ('common.pagination.page' | translate: { page: page })
          "
          (click)="goToPage(page)"
        >
          {{ page | localeNumber }}
        </button>
      }

      <button
        type="button"
        class="pagination__button pagination__arrow"
        [disabled]="currentPage === totalPages"
        (click)="nextPage()"
        [attr.aria-label]="'common.pagination.next' | translate"
        [title]="'common.pagination.next' | translate"
      >
        ›
      </button>

    </nav>

  </div>
}
