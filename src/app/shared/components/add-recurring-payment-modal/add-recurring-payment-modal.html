<div
  class="modal-backdrop"
  (click)="close()"
>
  <section
    class="payment-modal"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->

    <div class="payment-modal__header">
      <div>
        <h2>
          {{
            (
              isEditMode
                ? 'recurringPayments.form.editTitle'
                : 'recurringPayments.form.title'
            ) | translate
          }}
        </h2>

        <p>
          {{
            (
              isEditMode
                ? 'recurringPayments.form.editSubtitle'
                : 'recurringPayments.form.subtitle'
            ) | translate
          }}
        </p>
      </div>

      <button
        type="button"
        class="close-btn"
        aria-label="Close modal"
        title="Close modal"
        (click)="close()"
      >
        <lucide-icon
          [img]="X"
          [size]="18"
        />
      </button>
    </div>

    <!-- Form -->

    <form
      class="payment-form"
      #paymentForm="ngForm"
      (ngSubmit)="save()"
    >
      <!-- Title -->

      <div class="form-group">
        <label for="payment-title">
          {{
            'recurringPayments.form.paymentTitle'
              | translate
          }}
        </label>

        <input
          id="payment-title"
          type="text"
          name="title"
          [(ngModel)]="form.title"
          [placeholder]="
            'recurringPayments.form.paymentTitlePlaceholder'
              | translate
          "
          required
        />
      </div>

      <!-- Amount -->

      <div class="form-group">
        <label for="payment-amount">
          {{
            'recurringPayments.form.amount'
              | translate
          }}
        </label>

        <div class="amount-input">
          <input
            id="payment-amount"
            type="number"
            name="amount"
            [(ngModel)]="form.amount"
            min="1"
            placeholder="0"
            required
          />

          <span>
            {{
              'common.currency'
                | translate
            }}
          </span>
        </div>
      </div>

      <!-- Category -->

      <div class="form-group">
        <label for="payment-category">
          {{
            'recurringPayments.form.category'
              | translate
          }}
        </label>

        <select
          id="payment-category"
          name="category"
          [(ngModel)]="form.category"
          required
        >
          <option value="">
            {{
              'recurringPayments.form.selectCategory'
                | translate
            }}
          </option>

          @for (
            category of availableCategories;
            track category.id
          ) {
            <option
              [value]="category.name"
            >
              {{ category.name }}
            </option>
          }
        </select>
      </div>

      <!-- Account -->

      <div class="form-group">
        <label for="payment-account">
          {{
            'recurringPayments.form.account'
              | translate
          }}
        </label>

        <select
          id="payment-account"
          name="account"
          [(ngModel)]="form.account"
          required
        >
          <option value="">
            {{
              'recurringPayments.form.selectAccount'
                | translate
            }}
          </option>

          @for (
            account of accounts();
            track account.id
          ) {
            <option
              [value]="account.name"
            >
              {{ account.name }}
            </option>
          }
        </select>
      </div>

      <!-- Frequency -->

      <div class="form-group">
        <label>
          {{
            'recurringPayments.form.frequency'
              | translate
          }}
        </label>

        <div class="frequency-options">
          <button
            type="button"
            [class.active]="
              form.frequency === 'weekly'
            "
            (click)="
              form.frequency = 'weekly'
            "
          >
            {{
              'recurringPayments.frequency.weekly'
                | translate
            }}
          </button>

          <button
            type="button"
            [class.active]="
              form.frequency === 'monthly'
            "
            (click)="
              form.frequency = 'monthly'
            "
          >
            {{
              'recurringPayments.frequency.monthly'
                | translate
            }}
          </button>

          <button
            type="button"
            [class.active]="
              form.frequency === 'yearly'
            "
            (click)="
              form.frequency = 'yearly'
            "
          >
            {{
              'recurringPayments.frequency.yearly'
                | translate
            }}
          </button>
        </div>
      </div>

      <!-- Date -->

      <div class="form-group">
        <label for="next-payment-date">
          {{
            'recurringPayments.form.nextPayment'
              | translate
          }}
        </label>

        <input
          id="next-payment-date"
          type="date"
          name="nextPaymentDate"
          [(ngModel)]="form.nextPaymentDate"
          required
        />
      </div>

      <!-- Actions -->

      <div class="payment-modal__actions">
        <button
          type="button"
          class="cancel-btn"
          (click)="close()"
        >
          {{
            'recurringPayments.form.cancel'
              | translate
          }}
        </button>

        <button
          type="submit"
          class="save-btn"
          [disabled]="
            paymentForm.invalid
          "
        >
          {{
            (
              isEditMode
                ? 'recurringPayments.form.saveChanges'
                : 'recurringPayments.form.save'
            ) | translate
          }}
        </button>
      </div>
    </form>
  </section>
</div>
