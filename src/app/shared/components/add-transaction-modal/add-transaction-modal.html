<div
  class="modal-backdrop"
  (click)="close()"
>
  <section
    class="transaction-modal"
    (click)="$event.stopPropagation()"
  >

    <!-- Header -->

    <div class="transaction-modal__header">

      <div>
        <h2>
          {{
            (
              isEditMode
                ? 'transactions.form.editTitle'
                : 'transactions.form.addTitle'
            ) | translate
          }}
        </h2>

        <p>
          {{
            (
              isEditMode
                ? 'transactions.form.editSubtitle'
                : 'transactions.form.addSubtitle'
            ) | translate
          }}
        </p>
      </div>

      <button
        type="button"
        class="close-btn"
        aria-label="Close modal"
        title="Close"
        (click)="close()"
      >
        <lucide-icon
          [img]="X"
          [size]="18"
        />
      </button>

    </div>

    <!-- Form -->

    <form
      class="transaction-form"
      #transactionForm="ngForm"
      (ngSubmit)="save()"
    >

      <!-- Type -->

      <div class="form-group">

        <label>
          {{
            'transactions.form.type'
              | translate
          }}
        </label>

        <div class="transaction-types">

          <button
            type="button"
            [class.active]="
              form.type === 'expense'
            "
            (click)="
              selectType('expense')
            "
          >
            {{
              'transactions.types.expense'
                | translate
            }}
          </button>

          <button
            type="button"
            [class.active]="
              form.type === 'income'
            "
            (click)="
              selectType('income')
            "
          >
            {{
              'transactions.types.income'
                | translate
            }}
          </button>

          <button
            type="button"
            [class.active]="
              form.type === 'transfer'
            "
            (click)="
              selectType('transfer')
            "
          >
            {{
              'transactions.types.transfer'
                | translate
            }}
          </button>

        </div>

      </div>

      <!-- Title -->

      <div class="form-group">

        <label for="transaction-title">
          {{
            'transactions.form.title'
              | translate
          }}
        </label>

        <input
          id="transaction-title"
          type="text"
          name="title"
          [(ngModel)]="form.title"
          [placeholder]="
            'transactions.form.titlePlaceholder'
              | translate
          "
          required
        />

      </div>

      <!-- Amount -->

      <div class="form-group">

        <label for="transaction-amount">
          {{
            'transactions.form.amount'
              | translate
          }}
        </label>

        <input
          id="transaction-amount"
          type="number"
          name="amount"
          [(ngModel)]="form.amount"
          placeholder="0"
          min="1"
          required
        />

      </div>

      <!-- Category -->

      <div class="form-group">

        <label for="transaction-category">
          {{
            'transactions.form.category'
              | translate
          }}
        </label>

        <select
          id="transaction-category"
          name="category"
          [(ngModel)]="form.category"
          required
        >

          <option value="">
            {{
              'transactions.form.selectCategory'
                | translate
            }}
          </option>

          @for (
            category of availableCategories;
            track category.id
          ) {
            <option
              [value]="category.name"
            >
              {{ category.name }}
            </option>
          }

        </select>

      </div>

      <!-- Account -->

      <div class="form-group">

        <label for="transaction-account">
          {{
            'transactions.form.account'
              | translate
          }}
        </label>

        <select
          id="transaction-account"
          name="account"
          [(ngModel)]="form.account"
          required
        >

          <option value="">
            {{
              'transactions.form.selectAccount'
                | translate
            }}
          </option>

          @for (
            account of accounts();
            track account.id
          ) {
            <option
              [value]="account.name"
            >
              {{ account.name }}
            </option>
          }

        </select>

      </div>

      <!-- Date -->

      <div class="form-group">

        <label for="transaction-date">
          {{
            'transactions.form.date'
              | translate
          }}
        </label>

        <input
          id="transaction-date"
          type="date"
          name="date"
          [(ngModel)]="form.date"
          required
        />

      </div>

      <!-- Description -->

      <div class="form-group">

        <label for="transaction-description">
          {{
            'transactions.form.description'
              | translate
          }}
        </label>

        <textarea
          id="transaction-description"
          name="description"
          rows="3"
          [(ngModel)]="form.description"
          [placeholder]="
            'transactions.form.descriptionPlaceholder'
              | translate
          "
        ></textarea>

      </div>

      <!-- Actions -->

      <div class="transaction-modal__actions">

        <button
          type="button"
          class="cancel-btn"
          (click)="close()"
        >
          {{
            'common.actions.cancel'
              | translate
          }}
        </button>

        <button
          type="submit"
          class="save-btn"
          [disabled]="
            transactionForm.invalid
          "
        >
          {{
            (
              isEditMode
                ? 'transactions.form.saveChanges'
                : 'transactions.form.save'
            ) | translate
          }}
        </button>

      </div>

    </form>

  </section>
</div>
