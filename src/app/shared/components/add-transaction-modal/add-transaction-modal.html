<div
  class="modal-backdrop"
  (click)="close()"
>

  <section
    class="transaction-modal"
    (click)="$event.stopPropagation()"
  >

    <!-- =========================
         Header
    ========================== -->

    <div class="transaction-modal__header">

      <div>

        <h2>
          Add Transaction
        </h2>

        <p>
          Add a new financial transaction
        </p>

      </div>


      <button
        type="button"
        class="close-btn"
        aria-label="Close modal"
        title="Close"
        (click)="close()"
      >

        <lucide-icon
          [img]="X"
          [size]="18"
        />

      </button>

    </div>


    <!-- =========================
         Form
    ========================== -->

    <form
      class="transaction-form"
      (ngSubmit)="save()"
    >


      <!-- Transaction Type -->

      <div class="form-group">

        <label>
          Type
        </label>


        <div class="transaction-types">

          <button
            type="button"
            [class.active]="form.type === 'expense'"
            (click)="form.type = 'expense'"
          >
            Expense
          </button>


          <button
            type="button"
            [class.active]="form.type === 'income'"
            (click)="form.type = 'income'"
          >
            Income
          </button>


          <button
            type="button"
            [class.active]="form.type === 'transfer'"
            (click)="form.type = 'transfer'"
          >
            Transfer
          </button>

        </div>

      </div>


      <!-- Title -->

      <div class="form-group">

        <label for="transaction-title">
          Title
        </label>

        <input
          id="transaction-title"
          type="text"
          name="title"
          [(ngModel)]="form.title"
          placeholder="Grocery Shopping"
          required
        />

      </div>


      <!-- Amount -->

      <div class="form-group">

        <label for="transaction-amount">
          Amount
        </label>

        <input
          id="transaction-amount"
          type="number"
          name="amount"
          [(ngModel)]="form.amount"
          placeholder="0"
          min="1"
          required
        />

      </div>


      <!-- Category -->

      <div class="form-group">

        <label for="transaction-category">
          Category
        </label>

        <select
          id="transaction-category"
          name="category"
          [(ngModel)]="form.category"
          required
        >

          <option value="">
            Select category
          </option>


          @for (
            category of categories;
            track category
          ) {

            <option
              [value]="category"
            >
              {{ category }}
            </option>

          }

        </select>

      </div>


      <!-- Account -->

      <div class="form-group">

        <label for="transaction-account">
          Account
        </label>

        <select
          id="transaction-account"
          name="account"
          [(ngModel)]="form.account"
          required
        >

          <option value="">
            Select account
          </option>


          @for (
            account of accounts();
            track account.id
          ) {

            <option
              [value]="account.name"
            >
              {{ account.name }}
            </option>

          }

        </select>

      </div>


      <!-- Date -->

      <div class="form-group">

        <label for="transaction-date">
          Date
        </label>

        <input
          id="transaction-date"
          type="date"
          name="date"
          [(ngModel)]="form.date"
          required
        />

      </div>


      <!-- Description -->

      <div class="form-group">

        <label for="transaction-description">
          Description
        </label>

        <textarea
          id="transaction-description"
          name="description"
          rows="3"
          [(ngModel)]="form.description"
          placeholder="Optional description"
        ></textarea>

      </div>


      <!-- =========================
           Actions
      ========================== -->

      <div class="transaction-modal__actions">

        <button
          type="button"
          class="cancel-btn"
          (click)="close()"
        >
          Cancel
        </button>


        <button
          type="submit"
          class="save-btn"
        >
          Save Transaction
        </button>

      </div>

    </form>

  </section>

</div>
